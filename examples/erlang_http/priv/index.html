<!DOCTYPE html>
<html>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		body {
			font-family: Arial, sans-serif;
			margin: 0;
			background: #f5f5f5;
		}
		.nav-bar {
			display: flex;
			background: #607d8b;
			color: #fff;
			align-items: center;
			padding: 0 10px;
			height: 48px;
			position: relative;
		}
		.nav-bar button {
			background: none;
			border: none;
			color: #fff;
			padding: 12px 18px;
			cursor: pointer;
			font-size: 16px;
			outline: none;
			transition: background 0.2s;
		}
		.nav-bar button.active, .nav-bar button:hover {
			background: #455a64;
		}
		#icon {
			margin-left: auto;
			padding: 5px 0 5px 10px;
		}
		.panel {
			display: none;
			background: #fff;
			margin: 24px auto 0 auto;
			max-width: 600px;
			border-radius: 6px;
			box-shadow: 0 2px 8px rgba(0,0,0,0.08);
			padding: 24px;
			animation: fadein 0.7s;
		}
		.panel.active {
			display: block;
		}
		@keyframes fadein {
			from { opacity: 0; }
			to { opacity: 1; }
		}
		table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 12px;
		}
		th, td {
			padding: 8px 10px;
			border-bottom: 1px solid #e0e0e0;
			text-align: left;
		}
		tr:last-child td {
			border-bottom: none;
		}
		#loader {
			position: absolute;
			left: 50%;
			top: 50%;
			z-index: 1;
			width: 120px;
			height: 120px;
			margin: -75px 0 0 -75px;
			border: 16px solid #f3f3f3;
			border-radius: 50%;
			border-top: 16px solid #3498db;
			animation: spin 2s ease infinite;
		}
		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
		#footer {
			background: #009688;
			color: #fff;
			padding: 12px 24px;
			position: fixed;
			left: 0;
			bottom: 0;
			width: 100%;
			display: flex;
			justify-content: space-between;
			font-size: 15px;
		}
	</style>
	<head>
		<title>AtomVM Web Console</title>
		<style>
			#loader {
				position: absolute;
				left: 50%;
				top: 50%;
				z-index: 1;
				width: 100px;
				height: 100px;
				margin: -75px 0 0 -75px;
				border: 16px solid #f3f3f3;
				border-radius: 50%;
				border-top: 16px solid #3498db;
				width: 120px;
				height: 120px;
				-webkit-animation: spin 2s ease infinite;
				animation: spin 2s ease infinite;
			}
			@-webkit-keyframes spin {
				0% { -webkit-transform: rotate(0deg); }
				100% { -webkit-transform: rotate(360deg); }
			}
			@keyframes spin {
				0% { transform: rotate(0deg); }
				100% { transform: rotate(360deg); }
			}
			.animate-bottom {
				position: relative;
				-webkit-animation-name: animatebottom;
				-webkit-animation-duration: 1s;
				animation-name: animatebottom;
				animation-duration: 1s
			}
			@-webkit-keyframes animatebottom {
				from { bottom:-100px; opacity:0 }
				to { bottom:0px; opacity:1 }
			}
			@keyframes animatebottom {
				from{ bottom:-100px; opacity:0 }
				to{ bottom:0; opacity:1 }
			}
			#content {
				display: none;
			}
			#icon {
				text-align: right;
				padding: 5;
  				margin-top: 5px;
  				margin-right: 5px;
  			}
		</style>
	</head>
	<body>
		<div id="loader"></div>
		<div id="content" style="display:none;">
			<div id="tabs" style="min-height:600px">
				<div class="nav-bar">
					<button class="tab-btn active" data-panel="about">About</button>
					<button class="tab-btn" data-panel="system">System</button>
					<button class="tab-btn" data-panel="memory">Memory</button>
					<div id="icon"><img src="favicon.ico" alt="AtomVM logo" width="30" height="30" /></div>
				</div>
				<div id="about" class="panel active">
					<div id="about-view">
						Welcome to the AtomVM web console.<br><br>
						Use this console to explore the current state of your device.
					</div>
				</div>
				<div id="system" class="panel">
					<div id="system-view">
						<!-- System info will be rendered here -->
					</div>
				</div>
				<div id="memory" class="panel">
					<div id="memory-view">
						<!-- Memory info will be rendered here -->
					</div>
				</div>
			</div>
			<div id="footer">
				<div>AtomVM Web Console</div>
				<div></div>
			</div>
		</div>
		<script src="js/app.js"></script>
	</body>
</html>
